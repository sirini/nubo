name: Publish Linux release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: publish-linux-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ${{ fromJSON(vars.NUBO_RELEASE_BUILD_RUNNER || '["self-hosted","Linux","X64","nubo-release"]') }}
    timeout-minutes: 45
    steps:
      - name: Check out NUBO
        uses: actions/checkout@v4

      - name: Read release sources
        id: sources
        run: |
          echo "goapi_repository=$(jq -r .goapi.repository deploy/release-sources.json)" >> "$GITHUB_OUTPUT"
          echo "goapi_commit=$(jq -r .goapi.commit deploy/release-sources.json)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned GOAPI
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.sources.outputs.goapi_repository }}
          ref: ${{ steps.sources.outputs.goapi_commit }}
          path: goapi

      - name: Exclude pinned GOAPI from NUBO provenance
        run: echo "/goapi/" >> .git/info/exclude

      - name: Verify release version
        run: |
          version=$(awk -F= '$1 == "NUXT_PUBLIC_VERSION" { print $2; exit }' env.sample)
          test "$GITHUB_REF_NAME" = "v${version}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install NUBO dependencies
        run: npm ci

      - name: Verify integrated API contract
        env:
          GOAPI_SOURCE_DIR: ${{ github.workspace }}/goapi
        run: npm run test:release-contract

      - name: Test, lint, typecheck, and build NUBO
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build

      - name: Test and vet GOAPI in the official build environment
        run: |
          docker buildx build \
            --file goapi/build/ubuntu22/Dockerfile \
            --target build \
            --tag nubo-goapi-ci \
            --load \
            goapi
          docker run --rm nubo-goapi-ci bash -lc 'go test ./... && go vet ./...'

      - name: Build and verify integrated release
        env:
          GOAPI_SOURCE_DIR: ${{ github.workspace }}/goapi
        run: npm run build:release

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: nubo-linux-amd64
          path: |
            dist/nubo-*-linux-amd64.tar.gz
            dist/nubo-*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  fresh-install:
    needs: build-release
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out NUBO
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: nubo-linux-amd64
          path: dist

      - name: Fresh install and verify services
        run: bash scripts/fresh-install-smoke.sh dist/nubo-*-linux-amd64.tar.gz

  publish:
    needs: fresh-install
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: nubo-linux-amd64
          path: dist

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/nubo-*-linux-amd64.tar.gz
          dist/nubo-*-linux-amd64.tar.gz.sha256
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"

name: Verify configured release runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ fromJSON(vars.NUBO_RELEASE_BUILD_RUNNER || '["ubuntu-22.04"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out NUBO
        uses: actions/checkout@v7

      - name: Report runner capacity
        run: |
          uname -a
          printf 'CPU cores: '
          nproc
          free -h

      - name: Verify Docker
        run: |
          docker version
          docker run --rm ubuntu:22.04 true
